name: Jaffle Shop demo

on:
  pull_request:
    paths:
      - 'examples/jaffle_demo/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diffscope-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dbt
        run: python -m pip install 'dbt-duckdb>=1.11,<1.12' 'dbt-core>=1.11,<1.12'
      - name: Build baseline and candidate
        run: bash examples/jaffle_demo/build.sh
      - name: Compare models and update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./
        with:
          project-dir: examples/jaffle_demo
          models: orders customers
          base-schema: baseline
          target-schema: candidate
